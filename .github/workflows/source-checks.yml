name: Public source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source release boundaries
        run: python3 tools/check_public_tree.py --tracked-only
      - name: Test dependency preparation, team setup and launcher boundaries
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      # Actual X++ builds need caller-supplied Microsoft packages on ARM64 macOS.
      # See docs/validation.md. These public checks do not claim compiler parity.
